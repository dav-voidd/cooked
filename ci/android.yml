name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm install

      - name: Bundle offline libraries
        run: npm run web

      - name: Create Android project
        run: npx cap add android

      - name: App icon + splash screen
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#1a120e" --iconBackgroundColorDark "#1a120e" --splashBackgroundColor "#110d0b" --splashBackgroundColorDark "#110d0b"

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Cooked.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cooked-apk
          path: mobile/Cooked.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cooked for Android (build ${{ github.run_number }})
          body: |
            Download **Cooked.apk** below and open it on your Android phone to install.
            (You may need to allow "Install unknown apps" for your browser or file manager.)
          files: mobile/Cooked.apk
          make_latest: true
