<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Cooked</title>
<link rel="icon" href="logo.png">
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:#110d0b;color:#f6ede6;font:16px/1.5 Inter,"Segoe UI",system-ui,sans-serif;padding:24px;
       background-image:radial-gradient(700px 420px at 80% 0%,#ff5a1f2e,transparent 60%),radial-gradient(600px 400px at 0% 100%,#ffb13b1c,transparent 60%)}
  .card{width:100%;max-width:400px;background:#1b1410;border:1px solid #ffffff1a;border-radius:22px;padding:34px 28px;text-align:center;box-shadow:0 30px 80px #000a}
  h1{font-size:44px;font-weight:900;letter-spacing:-1.5px;background:linear-gradient(90deg,#ffc93c,#ff5a1f);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#c9b8ac;margin:10px 0 26px}
  .btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 18px;border-radius:14px;border:0;font:600 17px inherit;cursor:pointer;text-decoration:none}
  .g{background:#fff;color:#1f1f1f}.g:hover{background:#f1f1f1}
  .fire{background:linear-gradient(90deg,#ffb13b,#ff5a1f);color:#1a0d05;margin-top:12px}
  .small{font-size:13px;color:#8f7f74;margin:18px 0 0}
  .err{color:#ff6b6b}
  .spin{width:18px;height:18px;border:3px solid #0002;border-top-color:#ff5a1f;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="box">
  <h1>Cooked.</h1>
  <p id="msg">Sign in to sync your subjects and progress between your PC and phone.</p>
  <button class="btn g" id="go"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
  <p class="small">Only Cooked on your own devices receives your sign-in. Your data is visible to you only.</p>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const FIREBASE = {apiKey: "AIzaSyB1duFrfcWiYcUIPT74ClLsYSvz3EluKqY", authDomain: "cooked-74675.firebaseapp.com", projectId: "cooked-74675"};
const $ = s => document.querySelector(s), msg = (t, bad) => { $("#msg").innerHTML = t; $("#msg").className = bad ? "err" : ""; };
const qs = new URLSearchParams(location.search);
if (qs.get("to")) sessionStorage.setItem("cooked-to", JSON.stringify({to: qs.get("to"), state: qs.get("state") || ""}));
const {to, state} = JSON.parse(sessionStorage.getItem("cooked-to") || "{}");
// the sign-in is only ever handed to Cooked itself: the desktop app on this PC, or the phone app
const ok = to === "cooked://auth" || /^http:\/\/127\.0\.0\.1:\d{2,5}\/auth$/.test(to || "");
firebase.initializeApp(FIREBASE);
const auth = firebase.auth();
function handOff(u) {
  const p = new URLSearchParams({rt: u.refreshToken, uid: u.uid, email: u.email || "", state}).toString();
  sessionStorage.removeItem("cooked-to");
  auth.signOut();
  if (to === "cooked://auth") {
    const intent = `intent://auth?${p}#Intent;scheme=cooked;package=com.davvoidd.cooked;end`;
    $("#box").innerHTML = `<h1>Cooked.</h1><p>Signed in as <b>${(u.email || "").replace(/</g, "&lt;")}</b>.</p><a class="btn fire" href="${intent}">Open Cooked</a>
      <p class="small">If the app didn't open by itself, tap the button.</p>`;
    location.href = intent;
  } else {
    msg("Signed in. Sending you back to Cooked...");
    location.replace(`${to}?${p}`);
  }
}
if (!ok) { msg("Open this page from Cooked's Settings → <b>Sign in with Google</b>.", true); $("#go").style.display = "none"; }
else {
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
  auth.getRedirectResult().then(r => r.user && handOff(r.user)).catch(e => msg(e.message, true));
  $("#go").onclick = async () => {
    const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt: "select_account"});
    $("#go").innerHTML = `<span class="spin"></span> Signing in...`;
    try { const r = await auth.signInWithPopup(prov); handOff(r.user); }
    catch (e) {
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/cancelled-popup-request"].includes(e.code)) return auth.signInWithRedirect(prov);
      msg(e.code === "auth/popup-closed-by-user" ? "Sign-in was closed. Try again." : e.message, true);
      $("#go").textContent = "Continue with Google";
    }
  };
}
</script>
</body>
</html>
